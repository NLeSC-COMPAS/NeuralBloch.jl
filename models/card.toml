# NeuralBloch model card. Generated by NeuralBloch's export_bundle
# (uv run run.py export_bundle): do not edit by hand. Units are physical:
# seconds for T1, T2 and times, B1 relative to nominal, derivatives per
# second.

format = 2                            # the card format NeuralBloch.jl reads

[model]
family = "fisp600-rank16"             # export.MODEL_FAMILY: <sequence><ntr>-rank<rank>
version = 1                           # export.MODEL_VERSION: counts retrains
ntr = 600                             # readouts per voxel: the checkpoint's NTR
rank = 16                             # basis coefficients per voxel: U_signal's rank

[model.signal_and_derivatives]        # FCModel.forward: signal, dT1, dT2
onnx = "model.onnx"
sha256 = "b4797fa23fad6e1bd8c289ae5d06e929103d4223c090926c6199c35e25fde1b5"

[model.signal]                        # FCModel.forward_signal: signal
onnx = "model_signal.onnx"
sha256 = "d2f1e74b4ea561eeffd5d16406b42138e51df921d5a6f734869c0e28c3241a88"

[model.coefficients]                  # FCModel.forward_coefficients: coefficients
onnx = "model_coefficients.onnx"
sha256 = "2f76136bdecc847682755d279c9cb78bba241b8ca8f2be5f20e1fe59991d60d7"

[domain]                              # where the network was trained: data_config
T1 = [0.1, 6.0]                       # T1_lower, T1_upper: seconds, sampled log-uniformly
T2 = [0.01, 2.0]                      # T2_lower, T2_upper: seconds, sampled log-uniformly
B1 = [0.5, 1.5]                       # B1_lower, B1_upper: relative to nominal, sampled uniformly
constraint = "T2 < T1"                # data/data_generation.jl keeps only T1 > T2

[derivatives]                         # how the training targets were computed
method = "forward sensitivity"        # data_config DERIVATIVE_METHOD

[sequence]                            # FISP3D(...) in data/data_generation.jl, from data_config
kind = "FISP3D"
TR = 0.00558                          # TR_S, seconds
TE = 0.002745                         # TE_S, seconds
TI = 0.01084                          # TI_S, seconds
TW = 0.0                              # TW_S, seconds
max_state = 64                        # MAX_STATE
repetitions = 5                       # REPETITIONS
inversion_prepulse = true             # INVERSION_PREPULSE
wait_spoiling = true                  # WAIT_SPOILING
undersampling_factor = 1              # PY_UNDERSAMPLING_FACTOR
delta_k_spoil = 0.0                   # DELTA_K_SPOIL_RAD_PER_M, rad/m
rf_angle = "rf_data/rf_angle_list.txt"  # RF_ANGLE_FILE: flip angles, degrees
rf_phase = "rf_data/rf_phase_list.txt"  # RF_PHASE_FILE: phases, degrees

[provenance]
upstream = "NeuralBloch@d5c288465a8b54b146b5ed595837ccceb6b4756e"  # the NeuralBloch commit that exported it
checkpoint_epoch = 4970               # the checkpoint's epoch
config_sha256 = "30a4a45a64ae9d5e4dd4ad1de2cc9472640ed9789f5487010fbbb40accf377ef"  # of model_config and data_config
blochsimulators = "0.10.0"            # in the export environment
precision = "FP32"                    # of the ONNX models
