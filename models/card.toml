# Model card of the NeuralBloch surrogate bundled with NeuralBloch.jl.
#
# Upstream (github.com/NLeSC-COMPAS/NeuralBloch) publishes no card, so this
# one is written by hand, each field with its source. Upstream paths are at
# commit 9f4db84 (branch tensorRT). Units are physical: seconds for T₁, T₂
# and times, B₁ relative to nominal, derivatives per second.

[model]
onnx = "model.onnx"            # outputs/model.onnx, exported by scripts/export_onnx.py
sha256 = "3b1645293d530c15f25b8b6b858a3b7fb9ab6e1b8739a40627d8385d516bf607"
ntr = 600                      # outputs (batch, NTR, 2): src/model.py:86-99; 600 RF pulses below

[domain]                       # where the network was trained
T1 = [0.1, 5.0]                # config/data.yaml:17-18, sampled log-uniformly
T2 = [0.01, 2.0]               # config/data.yaml:20-21, sampled log-uniformly
B1 = [0.8, 1.2]                # config/data.yaml:23-24, sampled uniformly
constraint = "T2 < T1"         # data/data_generation.jl:78 keeps only T₁ > T₂

[derivatives]                  # data/data_generation.jl:119-124 uses BlochSimulators' defaults
method = "forward difference"  # BlochSimulators 0.9, src/derivatives/finite_difference.jl:61-84
dT1_step = 0.02                # ibid. line 2 (DEFAULT_ΔT₁), seconds
dT2_step = 0.0025              # ibid. line 3 (DEFAULT_ΔT₂), seconds

[sequence]                     # FISP3D(...) at data/data_generation.jl:89-101
kind = "FISP3D"
TR = 0.00558                   # config/data.yaml:5 (TR_S), seconds
TE = 0.002745                  # config/data.yaml:6 (TE_S), seconds
TI = 0.01084                   # config/data.yaml:7 (TI_S), seconds
TW = 0.0                       # config/data.yaml:8 (TW_S), seconds
max_state = 64                 # config/data.yaml:9
repetitions = 5                # config/data.yaml:10
inversion_prepulse = true      # config/data.yaml:11
wait_spoiling = true           # config/data.yaml:12
undersampling_factor = 1       # config/data.yaml:13 (PY_UNDERSAMPLING_FACTOR)
delta_k_spoil = 0.0            # config/data.yaml:14 (DELTA_K_SPOIL_RAD_PER_M), rad/m
rf_angle = "rf_data/rf_angle_list.txt"   # data/rf_data/rf_angle_list.txt: flip angles, degrees
rf_phase = "rf_data/rf_phase_list.txt"   # data/rf_data/rf_phase_list.txt: phases, degrees
                                         # (data/data_generation.jl:20 converts to radians)

[provenance]
upstream = "NeuralBloch@9f4db84"
# Upstream does not pin it (juliapkg.json names BlochSimulators without a
# version); 0.9 is the version the training data was generated with, per
# MRSTAT.jl's compat note on BlochSimulators.
blochsimulators = "0.9"
